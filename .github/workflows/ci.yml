name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Django & PostgreSQL Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: workspace_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Django Migrations & Configuration
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/workspace_test_db
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "0"
        run: |
          cd backend
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgres://postgres:testpassword@localhost:5432/workspace_test_db
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          cd backend
          python manage.py test

  frontend-ci:
    name: Next.js TypeScript & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Validate TypeScript Types
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Test Next.js Production Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api