services:
  db:
    image: postgres:16-alpine
    container_name: workspace-db
    restart: always
    environment:
      POSTGRES_DB: workspace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - workspace-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: workspace-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/workspace_db
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DEBUG=True
      # Note: REDIS_URL omitted so Django Channels defaults to InMemoryChannelLayer
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - workspace-net
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: workspace-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Internal Docker DNS for Next.js SSR / API rewrites:
      - INTERNAL_BACKEND_URL=http://backend:8000
      # Direct browser endpoint for client-side fetches:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - workspace-net
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:

networks:
  workspace-net:
    driver: bridge
