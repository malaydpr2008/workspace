version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: workspace-db
    restart: always
    environment:
      POSTGRES_DB: workspace_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - workspace-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workspace-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/workspace_db
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DEBUG=1
    networks:
      - workspace-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/\")'"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workspace-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Used by Next.js server-side fetches and rewrites inside the Docker network:
      - INTERNAL_BACKEND_URL=http://backend:8000
      # Used by client-side browser fetches hitting port 8000 directly:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - workspace-net

volumes:
  pgdata:

networks:
  workspace-net:
    driver: bridge
